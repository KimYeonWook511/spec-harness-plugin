# bdd 방법론 플러그인의 등록표.
# 엔진은 이 파일만 읽고 bdd를 켜고·끄고·다른 방법론과 엮는다.
# "무엇을 검사할지"는 여기서 선언하고, "어떻게 강제할지"는 각 repo(인스턴스)가 채운다.

name: bdd
description: 행위를 상황·행위·기대 결과로 적고, 그 시나리오가 검증의 단위가 되는 규율
version: 0.1.0

# spec 단계에서 이 방법론이 요구하는 산출물.
requires_in_spec:
  - 행위 시나리오 문서   # scenarios.md — 상황·행위·기대 결과 (templates/scenarios.md)

# Steps 단계에서 step 문서 본문에 문장으로 적어야 구현 단계에서 지켜지는 요구.
requires_in_steps:
  - 구현 지시는 그 step이 확인할 시나리오를 테스트로 옮기는 것부터 시작한다. 시나리오가 적은 값·경계를 그대로 쓴다. 다만 그 테스트가 어떻게 실패할지는 적지 않는다 — 실패 방식을 미리 규정하면 예상과 다를 때 지시와 현실이 어긋난다.
  - step 문서의 `## 검증 대상` 절에 그 step이 확인하는 시나리오를 목록으로 밝힌다. Acceptance Criteria는 그 테스트가 도는 범위를 실행하는 명령이면 되고, 테스트 이름·클래스·위치는 지목하지 않는다 — 어느 테스트에 어떤 이름으로 둘지는 기존 테스트 구조에 맞추는 구현 쪽 판단이다.

# Analyze 단계에 더해지는 검사(엔진이 adds_checks를 얹는 곳은 Analyze 하나다).
# 검사 대상은 Scenarios·Steps가 만든 산출물이지만, 판정은 Analyze에서 한 번에 일어난다.
# 규칙 자체를 서술하며 특정 언어·테스트 도구를 전제하지 않는다.
adds_checks:
  - id: scenario-shape
    rule: 모든 시나리오가 상황(시작할 때 이미 참인 것)·행위(누가 무엇을 하나)·기대 결과(무엇이 되어야 하나) 세 부분을 갖는가. 한 시나리오에 행위는 하나만 둔다 — 둘 이상이면 무엇이 무엇을 일으켰는지 가려진다.
  - id: outcome-observable
    rule: 기대 결과가 밖에서 관찰 가능한 것으로 적혀 있는가 — 응답·저장된 상태·발생한 이벤트. 어떤 내부 함수가 불렸는지는 결과가 아니다(구현을 바꾸면 결과가 그대로여도 시나리오가 깨진다).

  # 아래 세 검사는 명세에 그 경우가 적혀 있는지를 본다(실제 검증 여부는 코어 검사가 본다).
  - id: has-concurrency-case
    rule: 같은 자원을 동시에 만들거나 갱신할 수 있는 요구에 경합 시나리오가 있는가. 둘이 동시에 들어왔을 때 무엇이 남고 무엇이 거절되는지, 어느 요청이 먼저 처리되든 최종 상태가 같은지 적는다.
  - id: has-idempotency-case
    rule: 재시도·중복 요청이 가능한 요구에 멱등성 시나리오가 있는가. 같은 요청을 두 번 보냈을 때 결과가 한 번과 같은지, 자원이 하나만 생기는지 적는다.
  - id: has-failure-case
    rule: 외부 의존이나 입력 검증이 있는 요구에 실패 시나리오가 있는가. 무엇이 실패하면 어떤 오류가 나가고 어디까지 되돌아가는지(무엇이 남고 무엇이 사라지는지) 적는다.
  - id: not-applicable-declared
    rule: 위 세 경우 중 이 작업에 해당하지 않는 것을 "해당 없음"과 그 이유로 밝혔는가. 해당 없다고 적지 않고 그냥 비워 두면, 검토하고 없는 것인지 검토를 안 한 것인지 구분되지 않는다.

  - id: stability-marked
    rule: 모든 시나리오에 불변·유동 표시가 있는가. 위험영역(틀리면 데이터·돈·접근권한이 깨지는 곳)에 닿는 시나리오가 유동으로 표시돼 있으면 그 근거를 묻는다.

  # 아래 세 검사가 요구 → 시나리오 → 검증 사슬이 끊긴 곳을 찾는다.
  - id: every-requirement-has-case
    rule: 모든 기능 요구사항에 대응하는 시나리오가 있는가. 시나리오가 없는 요구사항은 검증 계획이 없는 것이다. 규칙·제약이 있는 요구사항은 성공 경우 하나로 끝나지 않는다 — 경계와 거절되는 경우도 필요하다.
  - id: every-criterion-has-case
    rule: 확인 가능한 완료 기준마다 대응하는 시나리오가 있는가. 만들어서 확인할 수 없는 기준(출시 후 지표 등)은 그렇게 밝히고 넘어간다.
  - id: scenario-has-source
    rule: 모든 시나리오가 기능 요구사항·완료 기준 중 적어도 하나를 가리키는가. 둘 다 비어 있으면 그 시나리오는 근거가 없다. 다만 한쪽만 비는 것은 정상이다 — 규칙·경계 시나리오는 요구사항에만 붙고, 성능·부하 시나리오는 기능 요구사항이 아니므로 완료 기준에만 붙는다.

  # 시나리오를 테스트로 옮길 때 값이 새는 것을 잡는다.
  - id: step-declares-scenarios
    rule: 각 step이 `## 검증 대상` 절에 확인하는 시나리오를 밝혔는가. 밝히지 않으면 어떤 시나리오가 어느 step에서 검증되는지 추측해야 하고, 계약으로 표시한 시나리오가 어느 step에도 없는 것을 잡지 못한다.
  - id: test-uses-scenario-values
    rule: step이 만들 테스트가 시나리오에 적힌 값·경계를 그대로 쓰는가. 시나리오가 "자정 정각"을 말하는데 테스트가 그 값을 피해 다른 값을 쓰면, 통과해도 그 경계는 검증되지 않는다.
  - id: test-asserts-outcome
    rule: 테스트가 결과를 확인하는가. 협력 객체가 호출됐는지만 확인하고 응답·저장된 상태·발생한 이벤트를 확인하지 않는 테스트는, 통과해도 그 동작이 맞다는 것을 보장하지 않는다.

# 이 방법론이 제공하는 spec 템플릿.
templates:
  - scenarios

# 검사를 "무엇으로" 강제하는지는 방법론이 정하지 않는다.
# 각 repo가 자기 도구(테스트 프레임워크·검증 스크립트 등)로 연결한다.
enforcement: instance-defined

# 조합 제약 — 다른 방법론과 함께 켤 때 엔진이 검증한다
requires: []
conflicts_with: []
min_engine_version: "3.0.0"   # requires_in_steps를 쓴다 — 그 이전 버전에는 이 요구를 받는 자리가 없다
